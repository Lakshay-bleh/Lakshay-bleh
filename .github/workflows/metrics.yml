name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Base
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used,recent
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css

      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.habits.svg
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.lines.svg
          template: classic
          base: ""
          plugin_lines: yes

      - name: Stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.stars.svg
          template: classic
          base: ""
          plugin_stars: yes

      - name: Follow-up
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.followup.svg
          template: classic
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories,user

      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.topics.svg
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons

      - name: People
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.people.svg
          template: classic
          base: ""
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_types: followers,following

      - name: Traffic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          filename: metrics.traffic.svg
          template: classic
          base: ""
          plugin_traffic: yes
