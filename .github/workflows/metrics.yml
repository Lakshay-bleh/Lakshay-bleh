name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate classic stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: metrics.classic.svg

      - name: Generate languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used,recent
          plugin_languages_limit: 8
          filename: metrics.languages.svg

      - name: Generate habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          filename: metrics.habits.svg

      - name: Generate isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.isocalendar.svg

      - name: Generate lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_lines: yes
          filename: metrics.lines.svg

      - name: Generate stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_stars: yes
          filename: metrics.stars.svg

      - name: Generate stargazers
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_stargazers: yes
          filename: metrics.stargazers.svg

      - name: Generate follow-up
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories,user
          filename: metrics.followup.svg

      - name: Generate topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 20
          plugin_topics_mode: icons
          filename: metrics.topics.svg

      - name: Generate traffic
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_traffic: yes
          filename: metrics.traffic.svg

      - name: Generate people
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-bleh
          template: classic
          base: ""
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_types: followers,following
          filename: metrics.people.svg
